<style>

  .hero h2 { font-family:'Jua',sans-serif; font-size:26px; margin:14px 0 4px; }
  .tag { display:inline-block; background:var(--accent); color:var(--ink); border-radius:999px; padding:4px 12px; font-size:13px; margin:3px; }

  ul { padding-left:20px; margin:0; line-height:1.75; }

    .card { box-shadow:none; border:1px solid #ddd; break-inside:avoid; }

  }
  .oh .ohsum { font-size:13px; opacity:.7; margin:0 0 10px; }
  .oh .ohr { display:flex; align-items:center; gap:8px; margin:6px 0; }
  .oh .ohn { width:46px; font-family:'Jua',sans-serif; font-size:15px; }
  .oh .ohb { flex:1; height:14px; background:#eef1f6; border-radius:8px; overflow:hidden; }
  .oh .ohb i { display:block; height:100%; border-radius:8px; }

  .oh em.lk { background:#e5484d; } .oh em.mn { background:#5b5bd6; }
  .oh .ohsub { font-family:'Jua',sans-serif; font-size:16px; margin:16px 0 0; }

  .ai .btns { display:flex; gap:8px; } .ai .btns .aibtn { flex:1; }

  .mode { display:flex; gap:6px; background:rgba(255,255,255,.15); border-radius:999px; padding:4px; margin:16px 0 0; }

  .pb h4 { font-family:'Jua',sans-serif; font-size:17px; margin:0 0 10px; }
  .pb .toggles { justify-content:flex-start; margin-bottom:8px; }

  .rel { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }

  .rel button.on { background:#e5487a; border-color:#e5487a; color:#fff; }
  .ghsep { text-align:center; font-size:26px; margin:6px 0; }
  .gh .pair { display:flex; align-items:center; justify-content:center; gap:4px; }

  .gh .pair .pc div svg { width:100%; height:100%; }
  .gh .pair .hrt { font-size:34px; animation:bob 1.2s ease-in-out infinite; }
  .gh .score { text-align:center; font-family:'Jua',sans-serif; font-size:54px; margin:6px 0 0; color:#e5487a; }
  .gh .score small { font-size:22px; }
  .gh .tier { text-align:center; font-family:'Jua',sans-serif; font-size:20px; margin:0 0 10px; }
  .gh .kw { text-align:center; }
  .today { background:linear-gradient(160deg,#fff8e1,#ffe9c7); }
  .today h3::before { content:'🌞 '; }
  .today .td { text-align:center; font-size:14px; opacity:.8; margin:0 0 4px; }
  .today .tp { text-align:center; margin:6px 0; }
  .today .tp b { font-family:'Jua',sans-serif; font-size:44px; color:#e07a1f; font-weight:400; }
  .today .tt { text-align:center; font-family:'Jua',sans-serif; font-size:20px; margin:0 0 10px; }
  .today .tm { height:12px; border-radius:8px; background:#f6dcb4; overflow:hidden; margin:0 10px 12px; }
  .today .tm i { display:block; height:100%; background:linear-gradient(90deg,#ffc56b,#e07a1f); border-radius:8px; }
  .tme { display:flex; gap:12px; align-items:center; }
  .tme .tmeimg { width:80px; height:80px; flex:none; }
  .tme .tmeimg svg { width:100%; height:100%; }
  .tme p { margin:4px 0 0; font-size:14px; opacity:.8; }
  #toMe { margin:0 0 16px; }
  .today h4 { margin:12px 0 4px; }
  .today ul { margin:0; padding-left:20px; }
  .today .th { background:#fff; border-radius:12px; padding:10px 12px; margin-top:12px; font-size:14px; line-height:1.7; }
  .gh .meter { height:14px; border-radius:8px; background:#f3dce4; overflow:hidden; margin:0 10px 6px; }
  .gh .meter i { display:block; height:100%; background:linear-gradient(90deg,#ff9ab8,#e5487a); border-radius:8px; }
  .ghd .pts { float:right; font-size:12px; border-radius:8px; padding:2px 8px; background:#ffe1ea; color:#c2185b; font-family:'Gowun Dodum',sans-serif; }
  .note { font-size:12px; color:#fff; opacity:.8; text-align:center; line-height:1.6; padding:8px 12px; }
  /* 따라다니는 캐릭터 */
  #buddy { position:fixed; right:14px; bottom:18px; width:96px; height:96px; z-index:10;
           transform:scale(0); transition:transform .5s cubic-bezier(.3,1.8,.5,1); pointer-events:none; }
  #buddy.pop { transform:scale(1); }
  #buddy svg { width:100%; height:100%; animation:bob 2.2s ease-in-out infinite; filter:drop-shadow(0 6px 8px rgba(0,0,0,.3)); }
  @keyframes bob { 50% { transform:translateY(-8px) rotate(-3deg); } }
  #bubble { position:fixed; right:112px; bottom:70px; background:#fff; border-radius:14px; padding:8px 12px; font-size:13px;
            max-width:180px; box-shadow:0 4px 12px rgba(0,0,0,.2); opacity:0; transition:opacity .4s; z-index:10; }
  #bubble.show { opacity:1; }
  /* 오행 배경 장식 */

  .drop { position:absolute; bottom:-40px; border-radius:50%; background:rgba(255,255,255,.18); animation:rise linear infinite; }

<body>
<div id="fx"></div>
<header>
  <h1>일주로 보는 나의 사주<span id="hostpig" title="쥔장은 계해일주 검은 돼지"></span></h1>
  <p>생년월일을 넣고 나의 일주 캐릭터를 만나보세요</p>
</header>
<main>
  <div class="mode"><button data-m="today">🌞 오늘의 운세</button><button class="on" data-m="me">🔮 내 사주 보기</button><button data-m="gh">💞 궁합 보기</button></div>
  <section class="card form" id="ghForm" style="display:none">
    <p class="relq">어떤 사이인가요?</p>
    <div class="rel" id="rel"><button class="on" data-r="lover">💑 배우자·연인</button><button data-r="child">👨‍👩‍👧 부모·자녀</button><button data-r="sibling">👫 형제자매</button><button data-r="friend">🤝 친구</button><button data-r="coworker">💼 직장동료</button><button data-r="partner">📈 사업파트너</button><button data-r="client">🙋 고객</button></div>
    <div class="pcrole" id="pcRole" style="display:none"><span>나는</span><div class="seg" style="--sc:#e5487a"><button class="on" data-v="parent">부모</button><button data-v="child">자녀</button></div></div>
    <div id="ghP1"></div><div class="ghsep">💑</div><div id="ghP2"></div>
    <button class="go" id="ghGo">궁합 보기</button>
    <p class="err" id="ghErr"></p>
  </section>
  <section class="card form" id="meForm">
    <div class="toggles">
      <div class="seg" id="g" style="--sc:#5b5bd6"><button class="on" data-v="m">남자</button><button data-v="f">여자</button></div>
      <div class="seg" id="cal" style="--sc:#4fb3c4"><button class="on" data-v="solar">양력</button><button data-v="lunar">음력</button></div>
      <div class="seg dis" id="leap" style="--sc:#e08e45"><button class="on" data-v="0">평달</button><button data-v="1">윤달</button></div>
    </div>
    <div class="row"><label>이름</label><input type="text" id="nm" placeholder="홍길동" maxlength="12"></div>
    <div class="row"><label>생년월일</label><input type="text" id="bd" placeholder="19881230" inputmode="numeric" maxlength="8"></div>
    <div class="row"><label>출생시간</label><input type="text" id="bt" class="short" placeholder="1459" inputmode="numeric" maxlength="4">
      <span class="sw" id="unk"><i></i>모름</span></div>
    <button class="go" id="go">내 일주 캐릭터 보기</button>
    <p class="err" id="err"></p>
  </section>
  <div id="content"></div>
</main>
<p class="note">이 내용은 사주 명리의 오행 이론을 바탕으로 한 재미용 콘텐츠이며,<br>의학적 진단이나 치료를 대신하지 않습니다. 건강이 걱정되면 전문 의료진과 상담하세요.</p>
<div id="bubble"></div>
<div id="buddy"></div>

<script>
const $ = s => document.querySelector(s);
$('#hostpig').innerHTML=CHAR(11,'수');
const STEM='갑을병정무기경신임계', STEMH='甲乙丙丁戊己庚辛壬癸', BR='자축인묘진사오미신유술해', BRH='子丑寅卯辰巳午未申酉戌亥';
const EL={목:['木','#3a9a63'],화:['火','#e0483a'],토:['土','#c99a2e'],금:['金','#8a929e'],수:['水','#2f5fb0']};
const STEME='목목화화토토금금수수', BRE='수토목목토화화토금금토수';
const STEMC=[...STEME].map(e=>EL[e][1]);
const elh=e=>`<em style="color:${EL[e][1]};font-style:normal">${EL[e][0]}</em>`;
let cur='계해';
function ganjiGrid(){
  let h=[...STEM].map((t,s)=>`<div class="hd"><b>${STEMH[s]}</b><span>${t}</span><i>${elh(STEME[s])}</i></div>`).join('');
  for(let i=0;i<60;i++){
    const s=i%10,b=i%12,n=STEM[s]+BR[b],k='y';

function findGuiin(m){
  const P=[m.year,m.month,m.day,m.time].map(h=>h?toK(h):'');
  const dayStem=P[2][0], monBr=P[1][1], out=[];
  for(const g of GW){
    const where=[];
    if(g.map){ const tg=g.map[dayStem]; P.forEach((p,i)=>{ if(p&&tg.includes(p[1])) where.push(POS[i]+'지'); }); }
    else { const tg=g.month[monBr];
      // 천덕귀인 표의 申/辛은 같은 한글 '신'을 구분하기 위한 표기 (申=지지, 辛=천간)
      if(tg==='申'){ P.forEach((p,i)=>{ if(p&&p[1]==='신') where.push(POS[i]+'지'); }); }
      else if(tg==='辛'){ P.forEach((p,i)=>{ if(p&&p[0]==='신') where.push(POS[i]+'간'); }); }
      else { P.forEach((p,i)=>{ if(!p) return; if(STEM.includes(tg)&&p[0]===tg) where.push(POS[i]+'간'); if(BR.includes(tg)&&!STEM.includes(tg)&&p[1]===tg) where.push(POS[i]+'지'); }); }
    }
    out.push({...g,where});
  }
  return out;
}
function guiinCard(m){
  const all=findGuiin(m), mine=all.filter(g=>g.where.length), rest=all.filter(g=>!g.where.length);
  const item=(g,off)=>`<div class="item${off?' off':''}"><h4>${g.e} ${g.n}<small>${off?g.by+' 기준':fmtW(g.where)+'에 있어요'}</small></h4><p>${g.d}</p></div>`;
  return `<section class="card gw"><h3>🍀 나에게 있는 귀인</h3>
   ${mine.length?`<div class="mine">${mine.map(g=>`<span class="chip">${g.e} ${g.n}</span>`).join('')}</div>${mine.map(g=>item(g)).join('')}`
     :`<p style="margin:0;line-height:1.7">대표 귀인 8가지는 사주에 보이지 않아요. 귀인이 없다는 건 스스로 길을 만드는 힘이 크다는 뜻이기도 해요!</p>`}

   ${m.time?'':'<p style="margin:10px 0 0;font-size:12px;opacity:.6">출생시간을 모르면 시주의 귀인은 빠져 있어요.</p>'}
  </section>`;
}

function todayInfo(n){
  if(typeof Solar==='undefined') return null;
  const k=new Date(Date.now()+9*3600e3), y=k.getUTCFullYear(), mo=k.getUTCMonth()+1, dd=k.getUTCDate();
  const tH=Solar.fromYmdHms(y,mo,dd,12,0,0).getLunar().getEightChar().getDay(), tK=toK(tH);
  const me=info(n), td=info(tK), m=me.se, t=td.se;
  const cat=m===t?'same':GEN[m]===t?'out':GEN[t]===m?'in':KE[m]===t?'wealth':'officer';
  const C=TODAY_CAT[cat], good=[...C.g], care=[...C.c]; let sc=C.sc, title=C.t;
  if(Math.abs(me.si-td.si)===5){ sc+=10; title='💞 합이 드는 날'; good.unshift('오늘의 기운과 내 일간이 합을 이뤄요. 반가운 인연, 약속, 계약이 잘 맺어지는 날!'); }
  const a=n[1], b=tK[1], ai=me.bi, bi=td.bi;
  if(pairIn(YUKHAP,a,b)){ sc+=8; good.push('오늘 일지와 육합이라 마음이 편안하고 일이 술술 풀려요'); }
  else if(a!==b&&ai%4===bi%4){ sc+=6; good.push('오늘은 삼합이 되는 날이라 함께하는 일에 시너지가 나요'); }
  else if(a===b){ sc+=2; good.push('나와 같은 일지의 날이라 익숙한 곳에서 편안함을 느껴요'); }
  else if(Math.abs(ai-bi)===6){ sc-=10; care.unshift('내 일지와 충이 되는 날이에요. 이동이나 운전은 천천히, 계획이 바뀌어도 유연하게!'); }
  else if(pairIn(WONJIN,a,b)){ sc-=5; care.unshift('원진이 되는 날이라 괜히 서운할 수 있어요. 오해는 그날 바로 풀어 주세요'); }
  sc=Math.max(55,Math.min(98,sc));

  const wd='일월화수목금토'[k.getUTCDay()];
  return {date:`${mo}월 ${dd}일 (${wd})`,tH,tK,sc,title,good,care,h,lucky:OH[mom].color,t};
}

}

const GEN={목:'화',화:'토',토:'금',금:'수',수:'목'}, KE={목:'토',토:'수',수:'화',화:'금',금:'목'};
const YUKHAP=['자축','인해','묘술','진유','사신','오미'], WONJIN=['자미','축오','인유','묘신','진해','사술'];
const pairIn=(arr,a,b)=>arr.some(x=>x===a+b||x===b+a);
function tipList(G){
  const r=Object.keys(REL).find(k=>REL[k]===G.R), A=G.an==='나'?'나':G.an+'님', B=(G.bn==='상대방'||G.bn===G.R.o)?G.R.o:G.bn+'님';
  const out=[], add=(lab,k)=>{ if(G.R.acts[k]&&!out.some(o=>o[1]===G.R.acts[k])) out.push([lab,G.R.acts[k]]); };
  if(r==='partner'||r==='coworker'){ add(A+':',G.ae); add(B+':',G.be); add('둘이 함께:',G.low); }
  else if(r==='child'){ const pc=G.R.o==='부모님'; add(A+' → '+B+(pc?'께:':'에게:'),G.be); add(pc?A+' → '+B+'께:':'둘이 함께:',G.low); }
  else if(r==='sibling'){ add(A+' → '+B+'에게:',G.be); add('둘이 함께:',G.low); }
  else if(r==='client'){ add(A+' → '+B+'에게:',G.be); add(A+' → '+B+'에게:',G.low); }
  else { add('',G.ae); add('',G.be); add('',G.low); }

  const sec=G.out.map(o=>`<div class="item"><h4>${o.t}</h4><p>${o.d}</p></div>`).join('');
  $('#content').innerHTML=`<section class="card gh"><h3>${G.R.label} 궁합</h3>
     <div class="pair"><div class="pc"><div>${CHAR(fa.bi,fa.se)}</div>${G.an}<br><small>${G.a}일주</small></div><span class="hrt">${G.R.label.split(' ')[0]}</span><div class="pc"><div>${CHAR(fb.bi,fb.se)}</div>${G.bn}<br><small>${G.b}일주</small></div></div>
     <p class="score">${G.sc}<small>점</small></p><div class="meter"><i style="width:${G.sc}%"></i></div><p class="tier">${G.tier}</p><div class="kw">${G.kw.map(k=>`<span class="tag">${k}</span>`).join('')}</div></section>
   <section class="card gw ghd"><h3>🔍 궁합 풀이</h3>${sec}</section>
   <section class="card gw"><h3>🌿 두 사람이 챙기면 좋은 건강</h3>
     <div class="item"><h4>두 사람 모두 ${ELN[G.low]}(${G.low}) 기운이 적은 편이에요</h4><p>🩺 함께 챙길 곳: ${OH[G.low].organ}<br>🥗 같이 먹으면 좋은 음식: ${OH[G.low].food}<br>🚶 같이 하면 좋은 습관: ${OH[G.low].act}</p></div>
     <div class="item"><h4>${G.R.act}</h4><p>${tipList(G).map(t=>'· '+(t[0]?'<b>'+t[0]+'</b> ':'')+t[1]).join('<br>')}</p></div></section>
   <section class="card gw"><h3>🐾 두 사람의 일주</h3>
     <div class="item"><h4>${G.an} · ${G.a}일주 ${fa.animal}</h4><p>“${da.o}”</p></div>
     <div class="item"><h4>${G.bn} · ${G.b}일주 ${fb.animal}</h4><p>“${db.o}”</p></div></section>
   <section class="card save"><h3>💾 궁합 결과 저장하기</h3>
     <p class="warn">⚠️ 이 사이트는 입력한 정보와 결과를 저장하지 않아요. 창을 닫으면 사라지니 꼭 복사해 두세요!</p>
     <div class="btns"><button id="ghCopy">📋 궁합 결과 복사하기</button><button id="pdfBtn">📄 PDF로 저장하기</button></div><p class="saveMsg" id="ghMsg"></p></section>
   <section class="card ai"><h3>🤖 더 자세한 궁합, AI에 물어보기</h3>
     <p class="aidesc">두 사람의 만세력을 AI에게 보내 더 자세한 궁합을 물어볼 수 있어요. 버튼을 누르면 질문이 자동으로 복사돼요.</p>
     <div class="btns"><a class="aibtn gpt" id="ghGpt" target="_blank" rel="noopener" href="https://chatgpt.com/?q=${encodeURIComponent(ghPrompt(A,B,G))}">💬 ChatGPT로 묻기</a><a class="aibtn gem" id="ghGem" href="https://gemini.google.com/app" target="_blank" rel="noopener">✨ Gemini로 묻기</a></div>
     <p class="aihint">AI 답변은 참고용이에요.</p></section>`;
  const b=$('#buddy'); b.classList.remove('pop'); b.innerHTML=CHAR(fa.bi,fa.se); setTimeout(()=>{ b.classList.add('pop'); say(`우리 궁합은 ${G.sc}점! ${G.tier}`); },150);
  $('#content').scrollIntoView({behavior:'smooth'});
}
function ghText(){
  const {A,B,G}=GH, L=[`[일주로 보는 나의 사주 · ${G.R.label.slice(2).trim()} 궁합]`,''];
  L.push(`${G.an} (${A.who.replace(/^[^·]*님 · /,'')}) · ${G.a}일주`,`${G.bn} (${B.who.replace(/^[^·]*님 · /,'')}) · ${G.b}일주`,'',`궁합 점수: ${G.sc}점 ${G.tier}`,'관계 키워드: '+G.kw.join(' '),'');
  G.out.forEach(o=>L.push(`■ ${o.t}`,o.d,''));
  L.push(`■ ${G.R.act.slice(2).trim()}: `+tipList(G).map(t=>(t[0]?t[0]+' ':'')+t[1]).join(' / '),`■ 두 사람이 챙기면 좋은 건강: ${ELN[G.low]} 기운 보충 - ${OH[G.low].food} / ${OH[G.low].act}`,'','※ 사주 명리 이론을 바탕으로 한 재미용 콘텐츠입니다.');
  return L.join('\n');
}
$('#content').addEventListener('click',e=>{
  if(!GH) return;
  if(e.target.closest('#ghCopy')) copyText(ghText()).then(()=>{ $('#ghMsg').textContent='✅ 복사됐어요! 카톡이나 메모장에 붙여넣어 보관하세요.'; }).catch(()=>{ $('#ghMsg').textContent='복사가 안 됐어요. 다시 눌러 주세요.'; });
  if(e.target.closest('#ghGpt')||e.target.closest('#ghGem')) copyText(ghPrompt(GH.A,GH.B,GH.G)).catch(()=>{});
});
function personBlock(i,label){
  return `<div class="pb"><h4>${label}</h4><div class="toggles">
    <div class="seg pseg" data-p="${i}" data-k="g" style="--sc:#5b5bd6"><button class="on" data-v="m">남자</button><button data-v="f">여자</button></div>
    <div class="seg pseg" data-p="${i}" data-k="cal" style="--sc:#4fb3c4"><button class="on" data-v="solar">양력</button><button data-v="lunar">음력</button></div>
    <div class="seg pseg dis" data-p="${i}" data-k="leap" style="--sc:#e08e45"><button class="on" data-v="0">평달</button><button data-v="1">윤달</button></div></div>
    <div class="row"><label>이름</label><input type="text" id="nm${i}" placeholder="${i===1?'나':'상대방'}" maxlength="12"></div>
    <div class="row"><label>생년월일</label><input type="text" id="bd${i}" placeholder="19881230" inputmode="numeric" maxlength="8"></div>
    <div class="row"><label>출생시간</label><input type="text" id="bt${i}" class="short" placeholder="1459" inputmode="numeric" maxlength="4"><span class="sw punk" data-p="${i}"><i></i>모름</span></div></div>`;
}
$('#ghP1').innerHTML=personBlock(1,'👤 나'); $('#ghP2').innerHTML=personBlock(2,'💑 상대방');
const PV={1:{g:'m',cal:'solar',leap:'0',unknown:false},2:{g:'m',cal:'solar',leap:'0',unknown:false}};
$('#rel').addEventListener('click',e=>{
  const bt=e.target.closest('button'); if(!bt) return;
  $('#rel').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===bt)); relType=bt.dataset.r;
  const em=REL[relType].label.split(' ')[0];
  $('#ghP2 h4').textContent=em+' '+REL[relType].o; $('.ghsep').textContent=em; $('#nm2').placeholder=REL[relType].o;
  $('#pcRole').style.display=relType==='child'?'flex':'none';
});
function setRole(v){ const C=REL.child, k=v==='child'?'C':'P'; C.o=v==='child'?'부모님':'자녀'; C.acts=C['acts'+k]; C.ask=C['ask'+k]; C.act=C['act'+k];
  $('#pcRole').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
  if(relType==='child'){ $('#ghP2 h4').textContent=C.label.split(' ')[0]+' '+C.o; $('#nm2').placeholder=C.o; } }
$('#pcRole').addEventListener('click',e=>{ const bt=e.target.closest('button'); if(bt) setRole(bt.dataset.v); });
$('#ghForm').addEventListener('click',e=>{
  const bt=e.target.closest('.pseg button');
  if(bt){ const seg=bt.parentNode, i=seg.dataset.p, k=seg.dataset.k; seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===bt)); PV[i][k]=bt.dataset.v;
    if(k==='cal'){ const lp=$(`.pseg[data-p="${i}"][data-k="leap"]`); lp.classList.toggle('dis',PV[i].cal!=='lunar'); if(PV[i].cal!=='lunar'){ PV[i].leap='0'; lp.querySelectorAll('button').forEach((x,j)=>x.classList.toggle('on',j===0)); } } }
  const sw=e.target.closest('.punk');
  if(sw){ const i=sw.dataset.p; PV[i].unknown=!PV[i].unknown; sw.classList.toggle('on',PV[i].unknown); $('#bt'+i).disabled=PV[i].unknown; if(PV[i].unknown) $('#bt'+i).value=''; }
});
['#bd1','#bt1','#bd2','#bt2'].forEach(id=>$(id).addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'')));
$('#ghGo').onclick=()=>{
  $('#ghErr').textContent='';
  if(typeof Solar==='undefined'){ $('#ghErr').textContent='만세력 계산 도구를 불러오지 못했어요. 새로고침해 주세요.'; return; }
  const get=i=>({bd:$('#bd'+i).value,bt:$('#bt'+i).value,unknown:PV[i].unknown,cal:PV[i].cal,leap:PV[i].leap,g:PV[i].g,nm:$('#nm'+i).value||(i===1?'나':REL[relType].o)});
  let A,B;
  try{ A=calc(get(1)); }catch(e){ $('#ghErr').textContent='[나] '+(typeof e==='string'?e:'날짜를 다시 확인해 주세요.'); return; }
  try{ B=calc(get(2)); }catch(e){ $('#ghErr').textContent='[상대방] '+(typeof e==='string'?e:'날짜를 다시 확인해 주세요.'); return; }
  A.nm=A.nm.replace(/님$/,''); B.nm=B.nm.replace(/님$/,'');
  showGH(A,B);
};
document.querySelector('.mode').addEventListener('click',e=>{
  const bt=e.target.closest('button'); if(!bt) return;
  document.querySelectorAll('.mode button').forEach(x=>x.classList.toggle('on',x===bt));
  mode=bt.dataset.m; const gh=mode==='gh';
  $('#ghForm').style.display=gh?'':'none'; $('#meForm').style.display=gh?'none':'';
  $('#go').textContent=mode==='today'?'오늘의 운세 보기':'내 일주 캐릭터 보기';
  $('#content').innerHTML=''; GH=null; $('#buddy').classList.remove('pop'); $('#bubble').classList.remove('show');
  applyTheme(gh?{bg1:'#4a1530',bg2:'#d9607f',accent:'#ffc2d4',fx:'drop'}:THEME['수']);
});

/* ---------- 입력 폼 ---------- */
const val={g:'m',cal:'solar',leap:'0'}; let unknown=false, mode='me';
document.querySelectorAll('#meForm .seg').forEach(seg=>seg.addEventListener('click',e=>{
  const bt=e.target.closest('button'); if(!bt) return;
  seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===bt));
  val[seg.id]=bt.dataset.v;
  if(seg.id==='cal'){ $('#leap').classList.toggle('dis',val.cal!=='lunar'); if(val.cal!=='lunar'){ val.leap='0'; $('#leap').querySelectorAll('button').forEach((x,i)=>x.classList.toggle('on',i===0)); } }
}));
$('#unk').onclick=()=>{ unknown=!unknown; $('#unk').classList.toggle('on',unknown); $('#bt').disabled=unknown; if(unknown) $('#bt').value=''; };
['#bd','#bt'].forEach(id=>$(id).addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'')));
const pad=n=>String(n).padStart(2,'0');
// 1987·1988 서머타임 (출생시간에서 1시간 빼기)
function isDST(y,m,d){ const v=y*10000+m*100+d; return (v>=19870510&&v<19871011)||(v>=19880508&&v<19881009); }
function shift(y,m,d,hh,mm,mins){ const t=new Date(Date.UTC(y,m-1,d,hh,mm)-mins*60000);
  return [t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate(),t.getUTCHours(),t.getUTCMinutes()]; }
function meInput(){ return {bd:$('#bd').value,bt:$('#bt').value,unknown:unknown,cal:val.cal,leap:val.leap,g:val.g,nm:$('#nm').value}; }
function calc(o){
  o=o||meInput();
  const bd=o.bd, bt=o.bt, unknown=o.unknown, val=o;
  if(bd.length!==8) throw '생년월일을 8자리로 입력해 주세요. (예: 19881230)';
  let y=+bd.slice(0,4), m=+bd.slice(4,6), d=+bd.slice(6,8);
  if(y<1900||y>2050) throw '1900년부터 2050년 사이로 입력해 주세요.';
  let hh=12, mm=0;
  if(!unknown){
    if(bt.length!==4) throw '출생시간을 4자리로 입력하거나 "모름"을 눌러 주세요. (예: 1459)';
    hh=+bt.slice(0,2); mm=+bt.slice(2,4);
    if(hh>23||mm>59) throw '출생시간을 다시 확인해 주세요.';
  }
  let sol;
  if(val.cal==='lunar'){
    try { sol=Lunar.fromYmd(y, val.leap==='1'?-m:m, d).getSolar(); }
    catch(e){ throw val.leap==='1'?'그 해에는 해당 윤달이 없어요. 평달로 다시 확인해 주세요.':'음력 날짜를 다시 확인해 주세요.'; }
    const back=sol.getLunar(); if(back.getDay()!==d||Math.abs(back.getMonth())!==m) throw '음력 날짜를 다시 확인해 주세요.';
  } else {
    const t=new Date(Date.UTC(y,m-1,d)); if(t.getUTCMonth()!==m-1||t.getUTCDate()!==d) throw '생년월일을 다시 확인해 주세요.';
    sol=Solar.fromYmd(y,m,d);
  }
  let Y=sol.getYear(), M=sol.getMonth(), D=sol.getDay();
  let dst=!unknown&&isDST(Y,M,D);
  const base=dst?shift(Y,M,D,hh,mm,60):[Y,M,D,hh,mm];
  // 년·월주: 절기 시각 기준 (한국시간 → 라이브러리 기준시 UTC+8로 1시간 보정)
  const a=shift(...base,60), ea=Solar.fromYmdHms(a[0],a[1],a[2],a[3],a[4],0).getLunar().getEightChar();
  // 일·시주: 동경 135도 표준시와 서울(약 127도) 차이 약 30분 보정
  const b=shift(...base,30), eb=Solar.fromYmdHms(b[0],b[1],b[2],b[3],b[4],0).getLunar().getEightChar();
  const nm=(o.nm||'').trim();
  const who=`${nm?nm+'님 · ':''}${val.g==='m'?'남자':'여자'} · ${val.cal==='lunar'?'음력'+(val.leap==='1'?'(윤달) ':' '):'양력 '}${y}.${pad(m)}.${pad(d)}${unknown?' · 시간 모름':' '+pad(hh)+':'+pad(mm)}${val.cal==='lunar'?` (양력 ${Y}.${pad(M)}.${pad(D)})`:''}`;
  return {year:ea.getYear(), month:ea.getMonth(), day:eb.getDay(), time:unknown?'':eb.getTime(), dayK:toK(eb.getDay()), who, nm};
}
$('#go').onclick=()=>{
  $('#err').textContent='';
  if(typeof Solar==='undefined'){ $('#err').textContent='만세력 계산 도구를 불러오지 못했어요. 새로고침해 주세요.'; return; }
  try { const m=calc(); if(mode==='today') showToday(m); else show(m.dayK,m); } catch(e){ $('#err').textContent=typeof e==='string'?e:'날짜를 다시 확인해 주세요.'; console.error(e); }
};
fx('water'); window.__ready=true;
</script>
