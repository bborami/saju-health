<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사주와 건강 · 일주 샘플 미리보기</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root { --bg1:#0b2a4a; --bg2:#1d5c8f; --accent:#7fd3ff; --card:rgba(255,255,255,.92); --ink:#1d2433; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Gowun Dodum',sans-serif; color:var(--ink);
         background:linear-gradient(180deg,var(--bg1),var(--bg2)); min-height:100vh; transition:background .8s; }
  header { text-align:center; padding:28px 16px 8px; color:#fff; }
  header h1 { font-family:'Jua',sans-serif; font-size:28px; margin:0 0 6px; }
  header p { margin:0; opacity:.85; font-size:14px; }
  .tabs { display:flex; gap:8px; justify-content:center; padding:16px; flex-wrap:wrap; }
  .tabs button { font-family:'Jua',sans-serif; font-size:16px; border:0; border-radius:999px; padding:10px 18px;
                 background:rgba(255,255,255,.2); color:#fff; cursor:pointer; }
  .tabs button.on { background:#fff; color:var(--ink); }
  main { max-width:560px; margin:0 auto; padding:0 16px 160px; }
  .card { background:var(--card); border-radius:22px; padding:22px; margin:16px 0; box-shadow:0 8px 24px rgba(0,0,0,.15); }
  .hero { text-align:center; }
  .pillar { display:inline-flex; flex-direction:column; align-items:center; background:var(--ink); color:#fff;
            border-radius:16px; padding:12px 22px; font-family:'Jua',sans-serif; }
  .pillar .hanja { font-size:40px; line-height:1.1; }
  .pillar small { font-size:13px; opacity:.8; }
  .hero h2 { font-family:'Jua',sans-serif; font-size:26px; margin:14px 0 4px; }
  .tag { display:inline-block; background:var(--accent); color:var(--ink); border-radius:999px; padding:4px 12px; font-size:13px; margin:3px; }
  h3 { font-family:'Jua',sans-serif; font-size:20px; margin:0 0 10px; }
  ul { padding-left:20px; margin:0; line-height:1.75; }
  .good h3::before { content:'👍 '; } .care h3::before { content:'🩺 '; } .tip h3::before { content:'💡 '; } .trait h3::before { content:'✨ '; }
  .ganji .grid { display:grid; grid-template-columns:repeat(10,1fr); gap:4px; }
  .cell { border:0; border-top:4px solid var(--c); background:#eef1f6; border-radius:6px; padding:5px 0;
          font-family:'Gowun Dodum',sans-serif; font-size:11px; color:var(--ink); cursor:pointer; }
  .cell.off { opacity:.4; }
  .cell.cur { outline:2px solid var(--ink); background:#fff; font-weight:bold; }
  .ganji .hint { font-size:12px; opacity:.7; margin:10px 0 0; text-align:center; }
  .note { font-size:12px; color:#fff; opacity:.8; text-align:center; line-height:1.6; padding:8px 12px; }
  /* 따라다니는 캐릭터 */
  #buddy { position:fixed; right:14px; bottom:18px; width:96px; height:96px; z-index:10;
           transform:scale(0); transition:transform .5s cubic-bezier(.3,1.8,.5,1); pointer-events:none; }
  #buddy.pop { transform:scale(1); }
  #buddy svg { width:100%; height:100%; animation:bob 2.2s ease-in-out infinite; filter:drop-shadow(0 6px 8px rgba(0,0,0,.3)); }
  @keyframes bob { 50% { transform:translateY(-8px) rotate(-3deg); } }
  #bubble { position:fixed; right:112px; bottom:70px; background:#fff; border-radius:14px; padding:8px 12px; font-size:13px;
            max-width:180px; box-shadow:0 4px 12px rgba(0,0,0,.2); opacity:0; transition:opacity .4s; z-index:10; }
  #bubble.show { opacity:1; }
  /* 오행 배경 장식 */
  #fx { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  header, .tabs, main, .note { position:relative; z-index:1; }
  .drop { position:absolute; bottom:-40px; border-radius:50%; background:rgba(255,255,255,.18); animation:rise linear infinite; }
  @keyframes rise { to { transform:translateY(-120vh); } }
</style>
</head>
<body>
<div id="fx"></div>
<header>
  <h1>나의 일주 캐릭터</h1>
  <p>샘플 미리보기 · 아래 60갑자표에서 계해 · 갑자 · 병오를 눌러보세요</p>
</header>
<main id="content"></main>
<p class="note">이 내용은 사주 명리의 오행 이론을 바탕으로 한 재미용 콘텐츠이며,<br>의학적 진단이나 치료를 대신하지 않습니다. 건강이 걱정되면 전문 의료진과 상담하세요.</p>
<div id="bubble"></div>
<div id="buddy"></div>

<script>
const SVG = {

 <ellipse cx="32" cy="68" rx="6" ry="4" fill="#f4a7b9" opacity=".6"/><ellipse cx="88" cy="68" rx="6" ry="4" fill="#f4a7b9" opacity=".6"/>
 <path d="M54 88 Q60 92 66 88" stroke="#f4a7b9" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <path d="M60 2 C54 12 52 16 60 20 C68 16 66 12 60 2Z" fill="#7fd3ff"/></svg>`,
rat: `<svg viewBox="0 0 120 120"><ellipse cx="60" cy="108" rx="30" ry="5" fill="rgba(0,0,0,.15)"/>
 <path d="M96 88 C118 84 116 60 104 66" stroke="#4a8fd4" stroke-width="4" fill="none" stroke-linecap="round"/>
 <circle cx="28" cy="32" r="20" fill="#4a8fd4"/><circle cx="92" cy="32" r="20" fill="#4a8fd4"/>
 <circle cx="28" cy="32" r="12" fill="#f6b8c8"/><circle cx="92" cy="32" r="12" fill="#f6b8c8"/>
 <ellipse cx="60" cy="66" rx="38" ry="36" fill="#5ba3e6"/>
 <ellipse cx="60" cy="76" rx="22" ry="18" fill="#dcefff"/>
 <circle cx="46" cy="58" r="5.5" fill="#111"/><circle cx="74" cy="58" r="5.5" fill="#111"/>
 <circle cx="47.5" cy="56" r="1.8" fill="#fff"/><circle cx="75.5" cy="56" r="1.8" fill="#fff"/>
 <ellipse cx="60" cy="70" rx="5" ry="4" fill="#e7708f"/>
 <path d="M60 74 v5 M54 80 Q60 85 66 80" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
 <path d="M40 70 H24 M40 75 L26 80 M80 70 H96 M80 75 L94 80" stroke="#2d5f99" stroke-width="1.5" stroke-linecap="round"/>
 <ellipse cx="36" cy="68" rx="5" ry="3.5" fill="#f6b8c8" opacity=".7"/><ellipse cx="84" cy="68" rx="5" ry="3.5" fill="#f6b8c8" opacity=".7"/>
 <path d="M60 12 C52 22 56 30 60 30 C64 30 68 22 60 12Z" fill="#6cc46c"/></svg>`,
horse: `<svg viewBox="0 0 120 120"><ellipse cx="60" cy="110" rx="30" ry="5" fill="rgba(0,0,0,.15)"/>
 <path d="M36 30 L30 8 L50 22Z" fill="#d9483b"/><path d="M84 30 L90 8 L70 22Z" fill="#d9483b"/>
 <ellipse cx="60" cy="58" rx="36" ry="34" fill="#e8584a"/>
 <path d="M38 30 C44 10 76 10 82 30 C76 22 66 26 60 20 C54 26 44 22 38 30Z" fill="#ffb347"/>
 <path d="M50 26 C54 14 66 14 70 26" fill="#ff8c2e"/>
 <ellipse cx="60" cy="84" rx="26" ry="20" fill="#f6c9a8"/>
 <circle cx="46" cy="54" r="5.5" fill="#111"/><circle cx="74" cy="54" r="5.5" fill="#111"/>
 <circle cx="47.5" cy="52" r="1.8" fill="#fff"/><circle cx="75.5" cy="52" r="1.8" fill="#fff"/>
 <ellipse cx="51" cy="82" rx="3" ry="4" fill="#9a5a3c"/><ellipse cx="69" cy="82" rx="3" ry="4" fill="#9a5a3c"/>
 <path d="M52 94 Q60 99 68 94" stroke="#9a5a3c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <ellipse cx="32" cy="66" rx="6" ry="4" fill="#ffb3a7" opacity=".8"/><ellipse cx="88" cy="66" rx="6" ry="4" fill="#ffb3a7" opacity=".8"/>
 <path d="M60 0 C50 12 54 20 60 20 C66 20 70 12 60 0Z" fill="#ffd23f"/></svg>`
};

const DATA = {
 gyehae: { hanja:'癸亥', name:'계해일주', animal:'검은 돼지', svg:'pig', elem:'물 + 물',
  theme:{bg1:'#06223f', bg2:'#1f6fae', accent:'#7fd3ff', fx:'water'},
  bubble:'나는 깊은 바다에서 온 검은 돼지! 같이 읽어볼까? 🌊',
  tags:['#깊은바다', '#직관왕', '#속깊은감성', '#물의끝판왕'],
  traits:['60갑자의 마지막 일주로, 물이 두 겹으로 쌓인 깊은 바다 같은 사람이에요.', '말하지 않아도 분위기와 사람 마음을 잘 읽는 직관파예요.', '겉으로는 순하고 느긋해 보이지만 속에는 자기만의 고집이 단단해요.', '상상력이 풍부하고, 혼자만의 시간으로 에너지를 채우는 타입이에요.'],
  good:['물처럼 유연해서 컨디션이 떨어져도 회복이 빠른 편이에요.', '스트레스를 오래 쥐고 있지 않고 흘려보내는 힘이 있어요.', '순환이 잘 될 때는 피부가 촉촉하고 얼굴이 맑아 보여요.'],
  care:['물 기운이 강해 몸이 차가워지기 쉬워요. 손발이 찬 편이라면 더 신경 써 주세요.', '오행에서 물은 신장과 방광을 상징해요. 붓기나 화장실 리듬 변화에 관심을 가져 보세요.', '생각이 많아 밤에 잠드는 시간이 늦어지기 쉬워요.'],
  tips:['따뜻한 물을 하루 여러 번 나눠 마시기', '하체 보온과 가벼운 반신욕', '잠들기 30분 전에는 휴대폰 멀리 두기'] },
 gapja: { hanja:'甲子', name:'갑자일주', animal:'푸른 쥐', svg:'rat', elem:'나무 + 물',
  theme:{bg1:'#0d3b2e', bg2:'#2f8f6a', accent:'#a8f0c6', fx:'leaf'},
  bubble:'60갑자 첫 번째, 시작의 아이콘 푸른 쥐야! 🌱',
  tags:['#새로운시작', '#쭉쭉성장', '#리더기질', '#빠른두뇌'],
  traits:['60갑자의 첫 번째 일주로, 무엇이든 처음 시작하는 에너지가 강해요.', '큰 나무처럼 곧고 위로 자라고 싶은 성장 욕구가 있어요.', '머리 회전이 빠르고 아이디어가 많아 앞장서는 일이 잘 어울려요.', '자존심이 강해서 지는 걸 싫어하는 면도 있어요.'],
  good:['물이 나무를 키워주는 구조라 기본 체력과 회복력이 좋은 편이에요.', '새로 시작한 운동이나 식단 습관이 잘 붙는 타입이에요.', '활동적이라 몸을 움직이며 스트레스를 푸는 데 능숙해요.'],
  care:['오행에서 나무는 간과 눈, 근육을 상징해요. 눈 피로와 목·어깨 뭉침에 신경 써 보세요.', '앞만 보고 달리다 쉬는 타이밍을 놓치기 쉬워요.', '긴장하면 몸이 뻣뻣해지기 쉬우니 유연성을 챙겨 주세요.'],
  tips:['20분마다 20초씩 먼 곳 바라보기', '아침저녁 5분 스트레칭', '초록 채소 한 접시 더하기'] },
 byeongo: { hanja:'丙午', name:'병오일주', animal:'붉은 말', svg:'horse', elem:'불 + 불',
  theme:{bg1:'#4a0f0a', bg2:'#d9482b', accent:'#ffd23f', fx:'fire'},
  bubble:'한여름 태양처럼 달리는 붉은 말이야! 🔥',
  tags:['#한여름태양', '#열정폭발', '#솔직담백', '#추진력갑'],
  traits:['불이 두 겹으로 겹친 일주로, 한여름 한낮의 태양 같은 사람이에요.', '밝고 솔직해서 어디서든 분위기를 띄우는 존재예요.', '하고 싶은 일이 생기면 바로 달려가는 추진력이 있어요.', '화끈하게 타오르는 만큼 금방 식기도 해요.'],
  good:['에너지가 넘치고 혈색이 좋아 보이는 편이에요.', '활동량이 많아 몸이 빨리 데워지고 움직임이 가벼워요.', '긍정적인 마음가짐이 컨디션을 끌어올려 줘요.'],
  care:['열이 위로 올라오기 쉬워 얼굴이 달아오르거나 가슴이 두근거릴 때가 있을 수 있어요.', '오행에서 불은 심장과 혈액순환을 상징해요. 혈압과 순환에 관심을 가져 보세요.', '확 타오른 뒤 한 번에 방전되기 쉬우니 체력 배분이 중요해요.'],
  tips:['물 자주 마셔서 열 식히기', '일정표에 쉬는 시간도 미리 적어두기', '저녁 산책이나 짧은 명상'] }
};

const $ = s => document.querySelector(s);
const STEM='갑을병정무기경신임계', STEMH='甲乙丙丁戊己庚辛壬癸', BR='자축인묘진사오미신유술해', BRH='子丑寅卯辰巳午未申酉戌亥';
const STEMC=['#4caf7a','#4caf7a','#e8584a','#e8584a','#e0b040','#e0b040','#c9ced6','#c9ced6','#2c3140','#2c3140'];
const READY={'계해':'gyehae','갑자':'gapja','병오':'byeongo'};
let cur='gyehae';
function ganjiGrid(){
  let h='';
  for(let i=0;i<60;i++){
    const s=i%10,b=i%12,n=STEM[s]+BR[b],k=READY[n]||'';
    h+=`<button class="cell${k?'':' off'}${k===cur?' cur':''}" data-n="${n}" data-k="${k}" title="${STEMH[s]+BRH[b]}" style="--c:${STEMC[s]}">${n}</button>`;
  }
  return `<section class="card ganji"><h3>60갑자 둘러보기</h3><div class="grid">${h}</div>
    <p class="hint">진하게 보이는 일주는 지금 볼 수 있어요. 나머지는 준비 중이에요.</p></section>`;
}
function say(t){ const bu=$('#bubble'); bu.textContent=t; bu.classList.add('show'); clearTimeout(say.t); say.t=setTimeout(()=>bu.classList.remove('show'),3000); }
function fx(type){
  const box = $('#fx'); box.innerHTML='';
  for(let i=0;i<18;i++){
    const d=document.createElement('div'); d.className='drop';
    const size=8+Math.random()*26;
    d.style.cssText=`left:${Math.random()*100}%;width:${size}px;height:${size}px;animation-duration:${8+Math.random()*10}s;animation-delay:${-Math.random()*15}s;`;
    if(type==='leaf'){ d.style.borderRadius='0 70% 0 70%'; d.style.background='rgba(168,240,198,.25)'; }
    if(type==='fire'){ d.style.borderRadius='50% 50% 50% 0'; d.style.background='rgba(255,210,63,.22)'; d.style.transform='rotate(-45deg)'; }
    box.appendChild(d);
  }
}
function li(a){ return a.map(x=>`<li>${x}</li>`).join(''); }
function show(k){
  const d=DATA[k], r=document.documentElement.style;
  r.setProperty('--bg1',d.theme.bg1); r.setProperty('--bg2',d.theme.bg2); r.setProperty('--accent',d.theme.accent);
  document.body.style.background=`linear-gradient(180deg,${d.theme.bg1},${d.theme.bg2})`;
  fx(d.theme.fx);
  cur=k;
  $('#content').innerHTML=`
   <section class="card hero">
     <div class="pillar"><span class="hanja">${d.hanja}</span><small>나의 일주</small></div>
     <h2>${d.name} · ${d.animal}</h2>
     <div>${d.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
     <p style="margin:10px 0 0;font-size:14px;opacity:.75">오행: ${d.elem}</p>
   </section>
   ${ganjiGrid()}
   <section class="card trait"><h3>이런 사람이에요</h3><ul>${li(d.traits)}</ul></section>
   <section class="card good"><h3>건강의 좋은 점</h3><ul>${li(d.good)}</ul></section>
   <section class="card care"><h3>이건 조금 신경 써요</h3><ul>${li(d.care)}</ul></section>
   <section class="card tip"><h3>${d.animal}의 생활 팁</h3><ul>${li(d.tips)}</ul></section>`;
  const b=$('#buddy'), bu=$('#bubble');
  b.classList.remove('pop'); bu.classList.remove('show');
  b.innerHTML=SVG[d.svg];
  setTimeout(()=>{ b.classList.add('pop'); bu.textContent=d.bubble; bu.classList.add('show'); },150);
  setTimeout(()=>bu.classList.remove('show'),4500);
  window.scrollTo({top:0,behavior:'smooth'});
}
$('#content').addEventListener('click',e=>{
  const c=e.target.closest('.cell'); if(!c) return;
  if(c.dataset.k) show(c.dataset.k); else say(`${c.dataset.n}일주는 곧 만나요! 조금만 기다려줘 🙏`);
});
show('gyehae');
</script>
</body>
</html>
